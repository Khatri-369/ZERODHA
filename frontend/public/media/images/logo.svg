<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52">
  <defs>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387ed1" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tfAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#387ed1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Modern Geometric Flow Emblem -->
  <g transform="translate(6, 6)">
    <rect x="0" y="16" width="7" height="24" rx="3.5" fill="url(#tfGrad)" />
    <rect x="11" y="8" width="7" height="32" rx="3.5" fill="url(#tfGrad)" opacity="0.85" />
    <rect x="22" y="0" width="7" height="40" rx="3.5" fill="url(#tfAccent)" />
    <path d="M4 26 L14 15 L26 4" stroke="#387ed1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35" />
    <circle cx="26" cy="4" r="3.5" fill="#10b981" filter="url(#glow)" />
  </g>
  <!-- Typography -->
  <text x="50" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="28" font-weight="800" fill="#1e293b" letter-spacing="-0.5">
    Trade<tspan fill="#387ed1">Flow</tspan>
  </text>
  <circle cx="204" cy="18" r="3.5" fill="#387ed1" />
</svg>